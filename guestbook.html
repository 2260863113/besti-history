<!DOCTYPE html>
<!-- 留言板页面：表单提交 + localStorage 持久化 + 按时间倒序展示 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>留言板 | 永不消逝的电波——我国密码事业发展史</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="guestbook">

  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html"><span class="star">★</span>红星杯 · 密码史</a>
      <nav class="main-nav">
        <a href="index.html"     data-nav="home">首页</a>
        <a href="history.html"   data-nav="history">密码史</a>
        <a href="figures.html"   data-nav="figures">人物</a>
        <a href="quiz.html"      data-nav="quiz">答题</a>
        <a href="guestbook.html" data-nav="guestbook">留言</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="section-title" style="margin-top:0">留言板</h1>
    <p style="text-align:center;color:var(--ink-light);font-size:0.95rem;margin-bottom:26px">
      留言保存在你的浏览器本地（localStorage），仅自己可见 · 刷新页面不会丢失
    </p>

    <!-- 左侧表单 + 右侧留言列表（移动端自动改为上下布局） -->
    <div class="guestbook-layout">

      <!-- 留言表单 -->
      <div class="gb-form-card">
        <h3>写留言</h3>
        <form id="gb-form">
          <label for="gb-name">昵称（必填）</label>
          <input type="text" id="gb-name" maxlength="20" placeholder="例如：小星">

          <label for="gb-content">留言内容（必填）</label>
          <textarea id="gb-content" maxlength="300" placeholder="写下你的观后感或对先辈的寄语……"></textarea>

          <button type="submit" class="btn">提交留言</button>
        </form>
      </div>

      <!-- 留言列表（倒序） -->
      <div class="gb-list-card">
        <h3>留言列表</h3>
        <div id="gb-list"></div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <p>© 2026 我国密码史主题展示网站 · <span class="gold">“红星杯”项目</span></p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/guestbook.js"></script>
</body>
</html>
